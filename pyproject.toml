[project]
name = "sku-match"
version = "0.2.0"
description = "YOLOE detection with DINOv2 SKU matching"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "ultralytics>=8.3.0",
    "clip",
    "chromadb>=1.5.0",
    "numpy>=1.14.5,<=2.3.5",
    "Pillow>=9.0.0",
    "opencv-python-headless>=4.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "transformers>=4.31.0",
    "optimum>=1.21.0",
    "onnxruntime-gpu>=1.18.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "onnxruntime>=1.18.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
cu128 = [
    "torch==2.9.1",
    "torchvision==0.24.1",
]
cu126 = [
    "torch==2.7.0",
    "torchvision==0.22.0",
]
cpu = [
    "torch==2.7.0",
    "torchvision==0.22.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
export = [
    "coremltools>=9.0",
]

[project.scripts]
sku-match = "main:main"
sku-match-api = "api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "api"]

[tool.uv]
conflicts = [
    [
        { extra = "cu128" },
        { extra = "cu126" },
    ],
    [
        { extra = "cu128" },
        { extra = "cpu" },
    ],
    [
        { extra = "cu126" },
        { extra = "cpu" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-cu126", extra = "cu126" },
]
torchvision = [
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-cu126", extra = "cu126" },
]
clip = { path = "./vendor/clip_package" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pyright]
venvPath = "."
venv = ".venv"
