[project]
name = "sku-match"
version = "0.2.0"
description = "YOLOE detection with DINOv2 SKU matching"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "ultralytics>=8.3.0",
    "clip",
    "chromadb>=1.5.0",
    "numpy>=1.14.5,<=2.3.5",
    "Pillow>=9.0.0",
    "opencv-python-headless>=4.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "onnx>=1.16.0",
    "onnxruntime-gpu>=1.18.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "onnxruntime>=1.18.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
cu126 = [
    "torch==2.7.0",
    "torchvision==0.22.0",
]
cpu = [
    "torch==2.7.0",
    "torchvision==0.22.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
export = [
    "coremltools>=9.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "cu126" },
        { extra = "cpu" },
    ],
]

[tool.uv.sources]
clip = { path = "./vendor/clip_package" }

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
